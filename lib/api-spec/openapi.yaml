components:
  schemas:
    VendorReviewInput:
      type: object
      properties:
        reviewNote:
          type: string

    UploadImagesResponse:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          items:
            type: string
          description: Server-hosted URLs for the uploaded images

    UploadDocumentsResponse:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items:
            type: object
            required: [fileName, fileUrl, mimeType]
            properties:
              fileName:
                type: string
              fileUrl:
                type: string
              mimeType:
                type: string

    DocumentInput:
      type: object
      required: [fileName, documentType, fileUrl]
      properties:
        fileName:
          type: string
        documentType:
          type: string
          enum: [faa_8130_3, easa_form_1, tcca_form_1, overhaul_report, test_report, coa, other]
        fileUrl:
          type: string

    DocumentStatusUpdate:
      type: object
      required: [verificationStatus]
      properties:
        verificationStatus:
          type: string
          enum: [pending, approved, rejected]
        reviewNote:
          type: ["string", "null"]

    ListingDocument:
      type: object
      required: [id, listingId, fileName, documentType, fileUrl, verificationStatus, createdAt, updatedAt]
      properties:
        id:
          type: integer
        listingId:
          type: integer
        fileName:
          type: string
        documentType:
          type: string
          enum: [faa_8130_3, easa_form_1, tcca_form_1, overhaul_report, test_report, coa, other]
        fileUrl:
          type: string
        verificationStatus:
          type: string
          enum: [pending, approved, rejected]
        reviewNote:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    DocumentsResponse:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/ListingDocument"

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

