openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Parts Link Aviation Marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: listings
    description: Part listings
  - name: inquiries
    description: Buyer inquiries
  - name: seller
    description: Seller dashboard
  - name: admin
    description: Admin operations
  - name: subscription
    description: Subscription management
  - name: mro
    description: MRO services directory
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new seller account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized

  /auth/change-password:
    patch:
      operationId: changePassword
      tags: [auth]
      summary: Change password (required on first admin login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          description: Validation error or incorrect current password
        "401":
          description: Not authenticated

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /user/switch-role:
    post:
      operationId: switchRole
      tags: [user]
      summary: Switch active role
      description: Switches the currently active role for this session. The requested role must exist in the user's roles array.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchRoleInput"
      responses:
        "200":
          description: Role switched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Role not available on this account
        "401":
          description: Not authenticated

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /permissions/me:
    get:
      operationId: getMyPermissions
      tags: [auth]
      summary: Get current user's server-derived permissions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permissions"
        "401":
          description: Unauthorized

  /listings/stats:
    get:
      operationId: getMarketplaceStats
      tags: [listings]
      summary: Get marketplace statistics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceStats"

  /listings/featured:
    get:
      operationId: getFeaturedListings
      tags: [listings]
      summary: Get featured verified listings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"

  /upload-documents:
    post:
      operationId: uploadDocuments
      tags: [listings]
      summary: Upload certification documents
      description: |
        Upload up to 10 certification documents via multipart/form-data (field name: `files`).
        Requires authentication. Accepted types: PDF, DOCX, JPG, PNG — max 20 MB each.
        Returns file metadata and server-hosted URLs.
      security:
        - sessionAuth: []
      responses:
        "201":
          description: Uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadDocumentsResponse"
        "400":
          description: Invalid file type, size, or count
        "401":
          description: Not authenticated

  /upload:
    post:
      operationId: uploadImages
      tags: [listings]
      summary: Upload listing images
      description: |
        Upload up to 5 images for a listing via multipart/form-data (field name: `images`).
        Requires authentication. Accepted types: JPEG, PNG, WebP, GIF — max 10 MB each.
        Returns an array of server-hosted image URLs.
      security:
        - sessionAuth: []
      responses:
        "201":
          description: Uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadImagesResponse"
        "400":
          description: Invalid file type, size, or count
        "401":
          description: Not authenticated

  /listings:
    get:
      operationId: getListings
      tags: [listings]
      summary: Browse listings
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: aircraft
          in: query
          schema:
            type: string
        - name: condition
          in: query
          schema:
            type: string
            enum: [new, overhauled, serviceable, as_removed, repaired]
        - name: saleType
          in: query
          schema:
            type: string
            enum: [outright, exchange, both]
        - name: manufacturer
          in: query
          schema:
            type: string
        - name: badge
          in: query
          schema:
            type: string
            enum: [pending_verification, documentation_reviewed, verified]
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingsPage"

    post:
      operationId: createListing
      tags: [listings]
      summary: Create a new listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "402":
          description: Listing limit reached — upgrade required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitReachedError"
        "401":
          description: Unauthorized

  /listings/{id}:
    get:
      operationId: getListing
      tags: [listings]
      summary: Get a single listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          description: Not found

    patch:
      operationId: updateListing
      tags: [listings]
      summary: Update a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"

    delete:
      operationId: deleteListing
      tags: [listings]
      summary: Delete a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /listings/{id}/badge:
    patch:
      operationId: updateListingBadge
      tags: [admin]
      summary: Update listing badge (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BadgeUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"

  /listings/{id}/inquiries:
    get:
      operationId: getInquiries
      tags: [inquiries]
      summary: Get inquiries for a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Inquiry"

    post:
      operationId: createInquiry
      tags: [inquiries]
      summary: Submit a buyer inquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inquiry"

  /seller/bulk-upload/template:
    get:
      operationId: getBulkUploadTemplate
      tags: [seller]
      summary: Download the CSV template for bulk listing upload
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /seller/bulk-upload/parse:
    post:
      operationId: parseBulkUpload
      tags: [seller]
      summary: Parse and validate an Excel or CSV file for bulk listing import
      description: |
        Upload a .xlsx or .csv file via multipart/form-data (field name: `file`).
        Returns valid and invalid rows with per-row validation errors.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Parse result with valid and invalid rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkParseResponse"
        "400":
          description: Bad request
        "401":
          description: Not authenticated

  /seller/bulk-upload/import:
    post:
      operationId: importBulkListings
      tags: [seller]
      summary: Create listings in bulk from pre-validated rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportRequest"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResponse"
        "400":
          description: Bad request
        "401":
          description: Not authenticated

  /seller/listings:
    get:
      operationId: getSellerListings
      tags: [seller]
      summary: Get current seller's listings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"

  /seller/cert-documents:
    get:
      operationId: getSellerCertDocuments
      tags: [seller]
      summary: List seller's cert documents
      security:
        - sessionAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertDocumentListResponse"
        "401":
          description: Unauthorized
    post:
      operationId: uploadSellerCertDocument
      tags: [seller]
      summary: Upload a new cert document (PDF only, max 10 MB)
      security:
        - sessionAuth: []
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertDocumentUploadResponse"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /seller/cert-documents/{id}/link:
    post:
      operationId: linkCertDocumentToListings
      tags: [seller]
      summary: Link a cert doc to multiple listings
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertDocumentLinkBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertDocumentUploadResponse"
        "401":
          description: Unauthorized
        "404":
          description: Document not found

  /admin/cert-documents/{id}/flag:
    patch:
      operationId: adminFlagCertDocument
      tags: [admin]
      summary: Flag or unflag a cert document
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCertDocumentFlagBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertDocumentUploadResponse"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /admin/sellers/{id}/cert-documents:
    get:
      operationId: getAdminSellerCertDocuments
      tags: [admin]
      summary: Get all cert documents for a seller (admin)
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertDocumentListResponse"
        "401":
          description: Unauthorized

  /seller/stats:
    get:
      operationId: getSellerStats
      tags: [seller]
      summary: Get seller statistics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerStats"

  /seller/analytics:
    get:
      operationId: getSellerAnalytics
      tags: [seller]
      summary: Get detailed analytics (Pro/Enterprise only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerAnalytics"
        "402":
          description: Upgrade required — Pro or Enterprise plan needed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitReachedError"
        "401":
          description: Unauthorized

  /listings/{id}/documents:
    get:
      operationId: getListingDocuments
      tags: [listings]
      summary: Get all documents for a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Documents list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentsResponse"
        "400":
          description: Invalid id

  /documents/{id}:
    patch:
      operationId: updateDocumentStatus
      tags: [admin]
      summary: Approve or reject a certification document (admin)
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentStatusUpdate"
      responses:
        "200":
          description: Document updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDocument"
        "400":
          description: Invalid status value
        "401":
          description: Not authenticated
        "403":
          description: Admin access required
        "404":
          description: Document not found

  /admin/listings:
    get:
      operationId: getAdminListings
      tags: [admin]
      summary: Get all listings for admin review
      parameters:
        - name: badge
          in: query
          schema:
            type: string
            enum: [pending_verification, documentation_reviewed, verified]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, removed, suspended, pending_review, deleted]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"

  /admin/listings/{id}:
    get:
      operationId: getAdminListing
      tags: [admin]
      summary: Get a single listing for admin review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          description: Not found

  /admin/listings/{id}/remove:
    post:
      operationId: adminRemoveListing
      tags: [admin]
      summary: Remove a listing (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin statistics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /subscription:
    get:
      operationId: getSubscription
      tags: [subscription]
      summary: Get current seller's subscription info
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionInfo"
        "401":
          description: Unauthorized

  /rfqs:
    get:
      operationId: getRfqs
      tags: [rfqs]
      summary: List open RFQs
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, open, quoted, awarded, closed, archived, suspended, deleted]
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqsPage"
    post:
      operationId: createRfq
      tags: [rfqs]
      summary: Post a new RFQ (no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfqInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rfq"

  /rfqs/{id}:
    get:
      operationId: getRfq
      tags: [rfqs]
      summary: Get a single RFQ with its responses
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqDetail"
        "404":
          description: Not found

  /rfqs/{id}/close:
    post:
      operationId: closeRfq
      tags: [rfqs]
      summary: Close an RFQ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rfq"

  /rfqs/{id}/responses:
    post:
      operationId: createRfqResponse
      tags: [rfqs]
      summary: Seller responds to an RFQ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfqResponseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqResponseItem"
        "401":
          description: Unauthorized

  /rfqs/{id}/quote:
    post:
      operationId: submitRfqQuote
      tags: [rfqs]
      summary: Seller submits a formal quote with price and lead time
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfqQuoteInput"
      responses:
        "201":
          description: Quote submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqResponseItem"
        "400":
          description: Validation error or RFQ not open
        "401":
          description: Unauthorized
        "402":
          description: Paid plan required

  /rfqs/{id}/award:
    post:
      operationId: awardRfqQuote
      tags: [rfqs]
      summary: Buyer awards a quote, transitioning RFQ to awarded status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfqAwardInput"
      responses:
        "200":
          description: RFQ awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rfq"
        "400":
          description: Invalid quote or RFQ not in quoteable state
        "404":
          description: Not found

  /rfqs/{id}/matches:
    get:
      operationId: getRfqMatches
      tags: [rfqs]
      summary: Get ranked seller matches for an RFQ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ranked seller matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqMatches"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /rfqs/{id}/recommendations:
    get:
      operationId: getRfqRecommendations
      tags: [rfqs]
      summary: Get intelligent price estimates, ranked sellers, and an auto-quote suggestion for an RFQ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqRecommendations"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /rfqs/aog/active:
    get:
      operationId: getAogActiveRfqs
      tags: [rfqs]
      summary: Get active AOG RFQs with escalation state (Pro/Enterprise only)
      responses:
        "200":
          description: Active AOG RFQs with escalation metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AogActiveRfqsResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — Pro or Enterprise plan required

  /conversations:
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Create a new buyer-seller conversation (no auth required — buyer-initiated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartConversationBody"
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateConversationResponse"
        "400":
          description: Bad request
        "404":
          description: Seller not found
    get:
      operationId: getConversations
      tags: [conversations]
      summary: Get all conversations for the authenticated seller
      responses:
