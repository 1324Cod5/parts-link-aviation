openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AeroParts Marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: listings
    description: Part listings
  - name: inquiries
    description: Buyer inquiries
  - name: seller
    description: Seller dashboard
  - name: admin
    description: Admin operations
  - name: subscription
    description: Subscription management
  - name: mro
    description: MRO services directory
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new seller account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized

  /auth/change-password:
    patch:
      operationId: changePassword
      tags: [auth]
      summary: Change password (required on first admin login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          description: Validation error or incorrect current password
        "401":
          description: Not authenticated

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /permissions/me:
    get:
      operationId: getMyPermissions
      tags: [auth]
      summary: Get current user's server-derived permissions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permissions"
        "401":
          description: Unauthorized

  /listings/stats:
    get:
      operationId: getMarketplaceStats
      tags: [listings]
      summary: Get marketplace statistics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceStats"

  /listings/featured:
    get:
      operationId: getFeaturedListings
      tags: [listings]
      summary: Get featured verified listings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"

  /listings:
    get:
      operationId: getListings
      tags: [listings]
      summary: Browse listings
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: aircraft
          in: query
          schema:
            type: string
        - name: condition
          in: query
          schema:
            type: string
            enum: [new, overhauled, serviceable, as_removed, repaired]
        - name: saleType
          in: query
          schema:
            type: string
            enum: [outright, exchange, both]
        - name: manufacturer
          in: query
          schema:
            type: string
        - name: badge
          in: query
          schema:
            type: string
            enum: [pending_verification, documentation_reviewed, verified]
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingsPage"

    post:
      operationId: createListing
      tags: [listings]
      summary: Create a new listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "402":
          description: Listing limit reached — upgrade required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitReachedError"
        "401":
          description: Unauthorized

  /listings/{id}:
    get:
      operationId: getListing
      tags: [listings]
      summary: Get a single listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          description: Not found

    patch:
      operationId: updateListing
      tags: [listings]
      summary: Update a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"

    delete:
      operationId: deleteListing
      tags: [listings]
      summary: Delete a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /listings/{id}/badge:
    patch:
      operationId: updateListingBadge
      tags: [admin]
      summary: Update listing badge (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BadgeUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"

  /listings/{id}/inquiries:
    get:
      operationId: getInquiries
      tags: [inquiries]
      summary: Get inquiries for a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Inquiry"

    post:
      operationId: createInquiry
      tags: [inquiries]
      summary: Submit a buyer inquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inquiry"

  /seller/listings:
    get:
      operationId: getSellerListings
      tags: [seller]
      summary: Get current seller's listings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"

  /seller/stats:
    get:
      operationId: getSellerStats
      tags: [seller]
      summary: Get seller statistics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerStats"

  /seller/analytics:
    get:
      operationId: getSellerAnalytics
      tags: [seller]
      summary: Get detailed analytics (Pro/Enterprise only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerAnalytics"
        "402":
          description: Upgrade required — Pro or Enterprise plan needed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitReachedError"
        "401":
          description: Unauthorized

  /admin/listings:
    get:
      operationId: getAdminListings
      tags: [admin]
      summary: Get all listings for admin review
      parameters:
        - name: badge
          in: query
          schema:
            type: string
            enum: [pending_verification, documentation_reviewed, verified]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, removed]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"

  /admin/listings/{id}:
    get:
      operationId: getAdminListing
      tags: [admin]
      summary: Get a single listing for admin review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          description: Not found

  /admin/listings/{id}/remove:
    post:
      operationId: adminRemoveListing
      tags: [admin]
      summary: Remove a listing (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin statistics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /subscription:
    get:
      operationId: getSubscription
      tags: [subscription]
      summary: Get current seller's subscription info
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionInfo"
        "401":
          description: Unauthorized

  /subscription/products:
    get:
      operationId: getSubscriptionProducts
      tags: [subscription]
      summary: List available Stripe plans with price IDs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionProductsResponse"

  /subscription/checkout:
    post:
      operationId: createCheckoutSession
      tags: [subscription]
      summary: Create a Stripe Checkout session for a given price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutSessionInput"
      responses:
        "200":
          description: OK — redirect the browser to the returned URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "400":
          description: Missing or invalid priceId
        "401":
          description: Unauthorized

  /subscription/portal:
    post:
      operationId: createPortalSession
      tags: [subscription]
      summary: Create a Stripe Billing Portal session for subscription management
      responses:
        "200":
          description: OK — redirect the browser to the returned URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSessionResponse"
        "400":
          description: No billing account found
        "401":
          description: Unauthorized

  /subscription/cancel:
    post:
      operationId: cancelSubscription
      tags: [subscription]
      summary: Cancel the active subscription at period end
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: No active subscription
        "401":
          description: Unauthorized

  /rfqs:
    get:
      operationId: getRfqs
      tags: [rfqs]
      summary: List open RFQs
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, open, quoted, awarded, closed, archived, suspended, deleted]
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqsPage"
    post:
      operationId: createRfq
      tags: [rfqs]
      summary: Post a new RFQ (no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfqInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rfq"

  /rfqs/{id}:
    get:
      operationId: getRfq
      tags: [rfqs]
      summary: Get a single RFQ with its responses
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqDetail"
        "404":
          description: Not found

  /rfqs/{id}/close:
    post:
      operationId: closeRfq
      tags: [rfqs]
      summary: Close an RFQ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rfq"

  /rfqs/{id}/responses:
    post:
      operationId: createRfqResponse
      tags: [rfqs]
      summary: Seller responds to an RFQ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfqResponseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqResponseItem"
        "401":
          description: Unauthorized

  /rfqs/{id}/quote:
    post:
      operationId: submitRfqQuote
      tags: [rfqs]
      summary: Seller submits a formal quote with price and lead time
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfqQuoteInput"
      responses:
        "201":
          description: Quote submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqResponseItem"
        "400":
          description: Validation error or RFQ not open
        "401":
          description: Unauthorized
        "402":
          description: Paid plan required

  /rfqs/{id}/award:
    post:
      operationId: awardRfqQuote
      tags: [rfqs]
      summary: Buyer awards a quote, transitioning RFQ to awarded status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfqAwardInput"
      responses:
        "200":
          description: RFQ awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rfq"
        "400":
          description: Invalid quote or RFQ not in quoteable state
        "404":
          description: Not found

  /rfqs/{id}/matches:
    get:
      operationId: getRfqMatches
      tags: [rfqs]
      summary: Get ranked seller matches for an RFQ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ranked seller matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqMatches"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /rfqs/{id}/recommendations:
    get:
      operationId: getRfqRecommendations
      tags: [rfqs]
      summary: Get intelligent price estimates, ranked sellers, and an auto-quote suggestion for an RFQ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqRecommendations"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /seller/rfqs:
    get:
      operationId: getSellerRfqStats
      tags: [seller]
      summary: Get RFQ summary stats for seller dashboard
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerRfqStats"
        "401":
          description: Unauthorized

  /admin/rfqs:
    get:
      operationId: getAdminRfqs
      tags: [admin]
      summary: Admin — list all RFQs across all statuses
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, open, quoted, awarded, closed, archived, suspended, deleted]
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRfqsPage"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/rfqs/{id}/action:
    post:
      operationId: adminRfqAction
      tags: [admin]
      summary: Admin — perform a lifecycle action on an RFQ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRfqActionInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [rfq, auditEntry]
                properties:
                  rfq:
                    $ref: "#/components/schemas/Rfq"
                  auditEntry:
                    $ref: "#/components/schemas/AdminRfqAuditEntry"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  /admin/rfqs/{id}/urgency:
    patch:
      operationId: adminSetRfqUrgency
      tags: [admin]
      summary: Admin — override urgency classification of an RFQ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRfqUrgencyInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [rfq, auditEntry]
                properties:
                  rfq:
                    $ref: "#/components/schemas/Rfq"
                  auditEntry:
                    $ref: "#/components/schemas/AdminRfqAuditEntry"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  /admin/rfqs/{id}/audit:
    get:
      operationId: getAdminRfqAudit
      tags: [admin]
      summary: Admin — get audit log for a specific RFQ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminRfqAuditEntry"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  /mro:
    get:
      operationId: getMroProfiles
      tags: [mro]
      summary: List MRO profiles with optional filters
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: aircraftType
          in: query
          schema:
            type: string
        - name: serviceType
          in: query
          schema:
            type: string
        - name: certification
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: string
        - name: partNumber
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MroProfilesPage"
    post:
      operationId: createMroProfile
      tags: [mro]
      summary: Register an MRO profile (seller auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MroProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MroProfile"
        "401":
          description: Unauthorized

  /mro/{id}:
    get:
      operationId: getMroProfile
      tags: [mro]
      summary: Get a single MRO profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MroProfileDetail"
        "404":
          description: Not found
    put:
      operationId: updateMroProfile
      tags: [mro]
      summary: Update MRO profile (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MroProfileInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MroProfile"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /mro/{id}/quote-requests:
    post:
      operationId: createServiceQuoteRequest
      tags: [mro]
      summary: Submit a service quote request to an MRO
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceQuoteRequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceQuoteRequest"

  /seller/mro-profile:
    get:
      operationId: getMyMroProfile
      tags: [seller]
      summary: Get my MRO profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MroProfile"
        "404":
          description: Not found
        "401":
          description: Unauthorized

  /admin/sellers:
    get:
      operationId: getAdminSellers
      tags: [admin]
      summary: List all sellers with stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminSeller"
        "401":
          description: Unauthorized

  /admin/sellers/{id}/status:
    patch:
      operationId: adminSetSellerStatus
      tags: [admin]
      summary: Activate or suspend a seller account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSellerStatusUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSeller"
        "401":
          description: Unauthorized

  /admin/sellers/{id}/plan:
    patch:
      operationId: adminSetSellerPlan
      tags: [admin]
      summary: Change a seller's subscription plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSellerPlanUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSeller"
        "401":
          description: Unauthorized

  /admin/mro:
    get:
      operationId: getAdminMroProfiles
      tags: [admin]
      summary: Admin list all MRO profiles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MroProfilesPage"
        "401":
          description: Unauthorized

  /admin/mro/{id}/status:
    post:
      operationId: adminSetMroStatus
      tags: [admin]
      summary: Admin approve or suspend an MRO
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MroStatusUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MroProfile"
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    LimitReachedError:
      type: object
      required: [error, plan, activeListings, listingLimit]
      properties:
        error:
          type: string
        plan:
          type: string
        activeListings:
          type: integer
        listingLimit:
          type: integer

    RegisterInput:
      type: object
      required: [email, password, companyName, contactName]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        companyName:
          type: string
        contactName:
          type: string
        phone:
          type: ["string", "null"]
        country:
          type: ["string", "null"]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, email, role, companyName, contactName, plan, computedRole, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string
          enum: [buyer, seller, admin, super_admin]
        computedRole:
          type: string
          enum: [admin, seller_free, seller_pro, seller_enterprise, mro_free, mro_verified, mro_premium]
          description: Combined role derived from role + effective plan + MRO profile presence. This is the authoritative role for UI routing and feature gating.
        companyName:
          type: string
        contactName:
          type: string
        phone:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        plan:
          type: string
          enum: [free, pro, enterprise, mro_verified, mro_premium]
        planExpiresAt:
          type: ["string", "null"]
        subscriptionStatus:
          type: ["string", "null"]
          enum: [active, trial, past_due, cancelled, suspended, null]
        mustChangePassword:
          type: boolean
        trustScore:
          type: integer
          description: Seller trust score 0–100
        trustBadge:
          $ref: "#/components/schemas/TrustBadge"
        trustScoreBreakdown:
          anyOf:
            - $ref: "#/components/schemas/TrustScoreBreakdown"
            - type: "null"
        createdAt:
          type: string

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    SubscriptionInfo:
      type: object
      required: [plan, effectivePlan, activeListings, listingLimit, canAddListing]
      properties:
        plan:
          type: string
          enum: [free, pro, enterprise, mro_verified, mro_premium]
          description: Subscribed plan (may differ from effectivePlan if payment is lapsed)
        effectivePlan:
          type: string
          enum: [free, pro, enterprise, mro_verified, mro_premium]
          description: Actual enforced plan based on payment status and grace period
        subscriptionStatus:
          type: ["string", "null"]
          enum: [active, trial, past_due, cancelled, suspended, null]
        currentPeriodEnd:
          type: ["string", "null"]
        gracePeriodEnd:
          type: ["string", "null"]
          description: "7 days after currentPeriodEnd when payment is past_due"
        trialEndsAt:
          type: ["string", "null"]
        daysUntilGraceExpires:
          type: ["integer", "null"]
          description: Days remaining in grace period; null if not in grace period
        planExpiresAt:
          type: ["string", "null"]
        activeListings:
          type: integer
        listingLimit:
          type: ["integer", "null"]
        canAddListing:
          type: boolean
        hasFullRfqAccess:
          type: boolean
        mroServiceLimit:
          type: ["integer", "null"]

    CheckoutSessionInput:
      type: object
      required: [priceId]
      properties:
        priceId:
          type: string
          description: Stripe price ID (e.g. price_1ABC...)

    CheckoutSessionResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: Stripe Checkout URL — redirect the browser here

    PortalSessionResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: Stripe Billing Portal URL — redirect the browser here

    SubscriptionProductsResponse:
      type: object
      required: [products]
      properties:
        publishableKey:
          type: ["string", "null"]
        products:
          type: array
          items:
            type: object
            required: [id, name, prices]
            properties:
              id:
                type: string
              name:
                type: string
              description:
                type: ["string", "null"]
              metadata:
                type: object
                additionalProperties:
                  type: string
              prices:
                type: array
                items:
                  type: object
                  required: [id, unitAmount, currency]
                  properties:
                    id:
                      type: string
                    unitAmount:
                      type: integer
                    currency:
                      type: string
                    interval:
                      type: ["string", "null"]
                    metadata:
                      type: object
                      additionalProperties:
                        type: string

    Permissions:
      type: object
      required:
        - computedRole
        - plan
        - canViewFullRfqs
        - canRespondToRfqs
        - canViewAnalytics
        - listingLimit
        - canUploadCertifications
      properties:
        computedRole:
          type: string
        plan:
          type: string
        canViewFullRfqs:
          type: boolean
        canRespondToRfqs:
          type: boolean
        canViewAnalytics:
          type: boolean
        listingLimit:
          type: ["integer", "null"]
        canUploadCertifications:
          type: boolean

    TrustBadge:
      type: string
      enum: [unverified, document_verified, aviation_verified, trusted_partner]

    TrustScoreBreakdown:
      type: object
      required: [certDocScore, listingAccuracyScore, transactionScore, responseTimeScore, disputePenalty, subscriptionBoost, total, badge]
      properties:
        certDocScore: { type: integer }
        certDocMax: { type: integer }
        listingAccuracyScore: { type: integer }
        listingAccuracyMax: { type: integer }
        transactionScore: { type: integer }
        transactionMax: { type: integer }
        responseTimeScore: { type: integer }
        responseTimeMax: { type: integer }
        disputePenalty: { type: integer }
        subscriptionBoost: { type: integer }
        subscriptionBoostMax: { type: integer }
        total: { type: integer }
        badge:
          $ref: "#/components/schemas/TrustBadge"

    Seller:
      type: object
      required: [id, companyName, contactName, country]
      properties:
        id:
          type: integer
        companyName:
          type: string
        contactName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        trustScore:
          type: integer
        trustBadge:
          $ref: "#/components/schemas/TrustBadge"

    Listing:
      type: object
      required: [id, partNumber, description, manufacturer, condition, saleType, quantity, price, badge, status, sellerId, createdAt]
      properties:
        id:
          type: integer
        partNumber:
          type: string
        description:
          type: string
        aircraftApplicability:
          type: ["string", "null"]
        manufacturer:
          type: string
        condition:
          type: string
          enum: [new, overhauled, serviceable, as_removed, repaired]
        saleType:
          type: string
          enum: [outright, exchange, both]
        quantity:
          type: integer
        price:
          type: ["number", "null"]
        certificationDocs:
          type: array
          items:
            type: string
        photos:
          type: array
          items:
            type: string
        traceHistory:
          type: ["string", "null"]
        badge:
          type: string
          enum: [pending_verification, documentation_reviewed, verified]
        status:
          type: string
          enum: [active, removed]
        sellerId:
          type: integer
        seller:
          $ref: "#/components/schemas/Seller"
        createdAt:
          type: string
        updatedAt:
          type: string

    ListingInput:
      type: object
      required: [partNumber, description, manufacturer, condition, saleType, quantity]
      properties:
        partNumber:
          type: string
        description:
          type: string
        aircraftApplicability:
          type: ["string", "null"]
        manufacturer:
          type: string
        condition:
          type: string
          enum: [new, overhauled, serviceable, as_removed, repaired]
        saleType:
          type: string
          enum: [outright, exchange, both]
        quantity:
          type: integer
        price:
          type: ["number", "null"]
        certificationDocs:
          type: array
          items:
            type: string
        photos:
          type: array
          items:
            type: string
        traceHistory:
          type: ["string", "null"]

    ListingUpdate:
      type: object
      properties:
        partNumber:
          type: string
        description:
          type: string
        aircraftApplicability:
          type: ["string", "null"]
        manufacturer:
          type: string
        condition:
          type: string
          enum: [new, overhauled, serviceable, as_removed, repaired]
        saleType:
          type: string
          enum: [outright, exchange, both]
        quantity:
          type: integer
        price:
          type: ["number", "null"]
        certificationDocs:
          type: array
          items:
            type: string
        photos:
          type: array
          items:
            type: string
        traceHistory:
          type: ["string", "null"]

    BadgeUpdate:
      type: object
      required: [badge]
      properties:
        badge:
          type: string
          enum: [pending_verification, documentation_reviewed, verified]

    ListingsPage:
      type: object
      required: [listings, total, page, limit]
      properties:
        listings:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Inquiry:
      type: object
      required: [id, listingId, buyerName, buyerEmail, message, createdAt]
      properties:
        id:
          type: integer
        listingId:
          type: integer
        buyerName:
          type: string
        buyerEmail:
          type: string
        buyerPhone:
          type: ["string", "null"]
        buyerCompany:
          type: ["string", "null"]
        message:
          type: string
        createdAt:
          type: string

    InquiryInput:
      type: object
      required: [buyerName, buyerEmail, message]
      properties:
        buyerName:
          type: string
        buyerEmail:
          type: string
        buyerPhone:
          type: ["string", "null"]
        buyerCompany:
          type: ["string", "null"]
        message:
          type: string

    MarketplaceStats:
      type: object
      required: [totalListings, verifiedSellers, totalManufacturers, recentListings]
      properties:
        totalListings:
          type: integer
        verifiedSellers:
          type: integer
        totalManufacturers:
          type: integer
        recentListings:
          type: integer
        byCondition:
          type: array
          items:
            type: object
            required: [condition, count]
            properties:
              condition:
                type: string
              count:
                type: integer
        byBadge:
          type: array
          items:
            type: object
            required: [badge, count]
            properties:
              badge:
                type: string
              count:
                type: integer

    SellerStats:
      type: object
      required: [totalListings, activeListings, totalInquiries, verifiedListings, plan, listingLimit, canAddListing]
      properties:
        totalListings:
          type: integer
        activeListings:
          type: integer
        totalInquiries:
          type: integer
        verifiedListings:
          type: integer
        plan:
          type: string
          enum: [free, pro, enterprise, mro_verified, mro_premium]
        listingLimit:
          type: ["integer", "null"]
        canAddListing:
          type: boolean

    AdminStats:
      type: object
      required: [totalListings, totalSellers, pendingVerification, totalInquiries]
      properties:
        totalListings:
          type: integer
        totalSellers:
          type: integer
        activeSellers:
          type: integer
        suspendedSellers:
          type: integer
        pendingVerification:
          type: integer
        totalInquiries:
          type: integer
        openRfqs:
          type: integer
        totalMro:
          type: integer

    AdminSeller:
      type: object
      required: [id, email, companyName, contactName, plan, status, createdAt, activeListings, totalInquiries]
      properties:
        id:
          type: integer
        email:
          type: string
        companyName:
          type: string
        contactName:
          type: string
        phone:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        plan:
          type: string
          enum: [free, pro, enterprise, mro_verified, mro_premium]
        planExpiresAt:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, suspended]
        createdAt:
          type: string
        activeListings:
          type: integer
        totalInquiries:
          type: integer

    AdminSellerStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, suspended]

    AdminSellerPlanUpdate:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          enum: [free, pro, enterprise, mro_verified, mro_premium]

    Rfq:
      type: object
      required: [id, buyerName, partNumber, description, quantity, status, urgency, createdAt, accessLevel]
      properties:
        id:
          type: integer
        buyerName:
          type: string
        buyerEmail:
          type: ["string", "null"]
          description: Masked to null for free-plan sellers; full value for Pro/Enterprise
        buyerCompany:
          type: ["string", "null"]
          description: Masked to null for free-plan sellers
        buyerPhone:
          type: ["string", "null"]
          description: Masked to null for free-plan sellers
        partNumber:
          type: string
        description:
          type: string
        aircraftApplicability:
          type: ["string", "null"]
        condition:
          type: ["string", "null"]
        quantity:
          type: integer
        status:
          type: string
          enum: [draft, open, quoted, awarded, closed, archived, suspended, deleted]
        urgency:
          $ref: "#/components/schemas/RfqUrgency"
        urgencyReason:
          type: ["string", "null"]
          description: Required when urgency is AOG; describes the grounding situation
        awardedResponseId:
          type: ["integer", "null"]
          description: ID of the awarded quote response when status is awarded
        accessLevel:
          type: string
          enum: [full, limited]
          description: "full = Pro/Enterprise (complete buyer contact); limited = Free (contact info hidden)"
        createdAt:
          type: string
        updatedAt:
          type: string

    RfqResponseItem:
      type: object
      required: [id, rfqId, sellerId, message, isQuote, createdAt]
      properties:
        id:
          type: integer
        rfqId:
          type: integer
        sellerId:
          type: integer
        sellerCompanyName:
          type: string
        message:
          type: string
        listingId:
          type: ["integer", "null"]
        listingPartNumber:
          type: ["string", "null"]
        price:
          type: ["string", "null"]
          description: Quoted price in USD (numeric string); null for non-quote responses
        leadTimeDays:
          type: ["integer", "null"]
          description: Estimated delivery lead time in days; null for non-quote responses
        isQuote:
          type: boolean
          description: True if this response includes a formal price quote
        createdAt:
          type: string

    RfqDetail:
      type: object
      required: [rfq, responses]
      properties:
        rfq:
          $ref: "#/components/schemas/Rfq"
        responses:
          type: array
          items:
            $ref: "#/components/schemas/RfqResponseItem"

    RfqInput:
      type: object
      required: [buyerName, buyerEmail, partNumber, description, quantity]
      properties:
        buyerName:
          type: string
        buyerEmail:
          type: string
        buyerCompany:
          type: ["string", "null"]
        buyerPhone:
          type: ["string", "null"]
        partNumber:
          type: string
        description:
          type: string
        aircraftApplicability:
          type: ["string", "null"]
        condition:
          type: ["string", "null"]
        quantity:
          type: integer
          minimum: 1
        urgency:
          $ref: "#/components/schemas/RfqUrgency"
        urgencyReason:
          type: ["string", "null"]
          description: Required when urgency is aog

    RfqResponseInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
        listingId:
          type: ["integer", "null"]

    RfqAwardInput:
      type: object
      required: [quoteId]
      properties:
        quoteId:
          type: integer
          description: ID of the quote response to award

    RfqQuoteInput:
      type: object
      required: [price, leadTimeDays]
      properties:
        price:
          type: number
          minimum: 0.01
          description: Quoted price in USD
        leadTimeDays:
          type: integer
          minimum: 1
          description: Estimated delivery lead time in calendar days
        message:
          type: string
          description: Optional covering note to accompany the quote
        listingId:
          type: ["integer", "null"]
          description: Optional link to an existing listing

    RfqMatchedSeller:
      type: object
      required: [sellerId, companyName, trustScore, trustBadge, plan, matchScore, responseCount]
      properties:
        sellerId:
          type: integer
        companyName:
          type: string
        trustScore:
          type: integer
          description: Raw trust score 0-100
        trustBadge:
          type: string
          enum: [unverified, document_verified, aviation_verified, trusted_partner]
        plan:
          type: string
        matchScore:
          type: number
          description: Computed match score 0-100 for this RFQ
        responseCount:
          type: integer
          description: Total RFQ responses this seller has submitted

    RfqMatches:
      type: object
      required: [rfqId, urgency, sellers]
      properties:
        rfqId:
          type: integer
        urgency:
          $ref: "#/components/schemas/RfqUrgency"
        sellers:
          type: array
          items:
            $ref: "#/components/schemas/RfqMatchedSeller"

    RfqPriceEstimate:
      type: object
      required: [low, mid, high, currency, dataPoints, confidence, urgencyAdjusted]
      properties:
        low:
          type: number
          description: Lower bound of estimated price range in USD
        mid:
          type: number
          description: Midpoint / most likely price in USD
        high:
          type: number
          description: Upper bound of estimated price range in USD
        currency:
          type: string
          example: USD
        dataPoints:
          type: integer
          description: Number of historical quotes used to derive this estimate
        confidence:
          type: string
          enum: [low, medium, high]
          description: "low = <3 data points, medium = 3–9, high = 10+"
        urgencyAdjusted:
          type: boolean
          description: Whether the urgency multiplier was applied

    RfqScoredSeller:
      type: object
      required: [sellerId, companyName, trustScore, trustBadge, plan, matchScore, responseCount, winRate, totalQuotes]
      properties:
        sellerId:
          type: integer
        companyName:
          type: string
        trustScore:
          type: integer
        trustBadge:
          type: string
          enum: [unverified, document_verified, aviation_verified, trusted_partner]
        plan:
          type: string
        matchScore:
          type: number
          description: Composite 0–100 score incorporating trust, tier, win rate, response speed, and pricing accuracy
        responseCount:
          type: integer
        totalQuotes:
          type: integer
          description: Total formal price quotes submitted
        winRate:
          type: number
          description: Fraction of submitted quotes that were awarded (0–1)
        avgResponseTimeHours:
          type: ["number", "null"]
          description: Average time in hours from RFQ creation to first response
        pricingAccuracy:
          type: ["number", "null"]
          description: How closely the seller prices relative to market median (0–1, 1 = perfect)

    RfqAutoQuoteSuggestion:
      type: object
      required: [suggestedPrice, suggestedLeadTimeDays, rationale]
      properties:
        suggestedPrice:
          type: number
          description: Recommended quote price in USD derived from historical data
        suggestedLeadTimeDays:
          type: integer
          description: Recommended lead time based on urgency and historical patterns
        topSeller:
          $ref: "#/components/schemas/RfqScoredSeller"
        rationale:
          type: string
          description: Human-readable explanation of the suggestion

    RfqRecommendations:
      type: object
      required: [rfqId, urgency, priceEstimate, rankedSellers]
      properties:
        rfqId:
          type: integer
        urgency:
          $ref: "#/components/schemas/RfqUrgency"
        priceEstimate:
          $ref: "#/components/schemas/RfqPriceEstimate"
        rankedSellers:
          type: array
          items:
            $ref: "#/components/schemas/RfqScoredSeller"
        autoQuoteSuggestion:
          $ref: "#/components/schemas/RfqAutoQuoteSuggestion"

    RfqsPage:
      type: object
      required: [rfqs, total, page, limit]
      properties:
        rfqs:
          type: array
          items:
            $ref: "#/components/schemas/Rfq"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    RfqUrgency:
      type: string
      enum: [aog, critical, high_priority, standard, planned]
      description: >
        Urgency classification for the RFQ.
        AOG (Aircraft on Ground) triggers the highest notification priority and fastest escalation.

    AdminRfqUrgencyInput:
      type: object
      required: [urgency, reason]
      properties:
        urgency:
          $ref: "#/components/schemas/RfqUrgency"
        urgencyReason:
          type: ["string", "null"]
          description: Required when urgency is aog
        reason:
          type: string
          description: Admin's reason for changing the urgency classification

    AdminRfqActionInput:
      type: object
      required: [action, reason]
      properties:
        action:
          type: string
          enum: [close, archive, suspend, reopen, delete]
          description: Lifecycle action to perform on the RFQ
        reason:
