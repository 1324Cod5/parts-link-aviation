openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AeroParts Marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: listings
    description: Part listings
  - name: inquiries
    description: Buyer inquiries
  - name: seller
    description: Seller dashboard
  - name: admin
    description: Admin operations
  - name: subscription
    description: Subscription management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new seller account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /listings/stats:
    get:
      operationId: getMarketplaceStats
      tags: [listings]
      summary: Get marketplace statistics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceStats"

  /listings/featured:
    get:
      operationId: getFeaturedListings
      tags: [listings]
      summary: Get featured verified listings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"

  /listings:
    get:
      operationId: getListings
      tags: [listings]
      summary: Browse listings
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: aircraft
          in: query
          schema:
            type: string
        - name: condition
          in: query
          schema:
            type: string
            enum: [new, overhauled, serviceable, as_removed, repaired]
        - name: saleType
          in: query
          schema:
            type: string
            enum: [outright, exchange, both]
        - name: manufacturer
          in: query
          schema:
            type: string
        - name: badge
          in: query
          schema:
            type: string
            enum: [pending_verification, documentation_reviewed, verified]
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingsPage"

    post:
      operationId: createListing
      tags: [listings]
      summary: Create a new listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "402":
          description: Listing limit reached — upgrade required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitReachedError"
        "401":
          description: Unauthorized

  /listings/{id}:
    get:
      operationId: getListing
      tags: [listings]
      summary: Get a single listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          description: Not found

    patch:
      operationId: updateListing
      tags: [listings]
      summary: Update a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"

    delete:
      operationId: deleteListing
      tags: [listings]
      summary: Delete a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /listings/{id}/badge:
    patch:
      operationId: updateListingBadge
      tags: [admin]
      summary: Update listing badge (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BadgeUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"

  /listings/{id}/inquiries:
    get:
      operationId: getInquiries
      tags: [inquiries]
      summary: Get inquiries for a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Inquiry"

    post:
      operationId: createInquiry
      tags: [inquiries]
      summary: Submit a buyer inquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inquiry"

  /seller/listings:
    get:
      operationId: getSellerListings
      tags: [seller]
      summary: Get current seller's listings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"

  /seller/stats:
    get:
      operationId: getSellerStats
      tags: [seller]
      summary: Get seller statistics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerStats"

  /admin/listings:
    get:
      operationId: getAdminListings
      tags: [admin]
      summary: Get all listings for admin review
      parameters:
        - name: badge
          in: query
          schema:
            type: string
            enum: [pending_verification, documentation_reviewed, verified]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, removed]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"

  /admin/listings/{id}/remove:
    post:
      operationId: adminRemoveListing
      tags: [admin]
      summary: Remove a listing (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin statistics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /subscription:
    get:
      operationId: getSubscription
      tags: [subscription]
      summary: Get current seller's subscription info
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionInfo"
        "401":
          description: Unauthorized

  /subscription/upgrade:
    post:
      operationId: upgradePlan
      tags: [subscription]
      summary: Upgrade to a paid plan (simulated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradePlanInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionInfo"
        "401":
          description: Unauthorized

  /subscription/downgrade:
    post:
      operationId: downgradePlan
      tags: [subscription]
      summary: Downgrade to free plan
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionInfo"
        "401":
          description: Unauthorized

  /rfqs:
    get:
      operationId: getRfqs
      tags: [rfqs]
      summary: List open RFQs
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed]
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqsPage"
    post:
      operationId: createRfq
      tags: [rfqs]
      summary: Post a new RFQ (no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfqInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rfq"

  /rfqs/{id}:
    get:
      operationId: getRfq
      tags: [rfqs]
      summary: Get a single RFQ with its responses
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqDetail"
        "404":
          description: Not found

  /rfqs/{id}/close:
    post:
      operationId: closeRfq
      tags: [rfqs]
      summary: Close an RFQ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rfq"

  /rfqs/{id}/responses:
    post:
      operationId: createRfqResponse
      tags: [rfqs]
      summary: Seller responds to an RFQ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfqResponseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfqResponseItem"
        "401":
          description: Unauthorized

  /seller/rfqs:
    get:
      operationId: getSellerRfqStats
      tags: [seller]
      summary: Get RFQ summary stats for seller dashboard
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerRfqStats"
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    LimitReachedError:
      type: object
      required: [error, plan, activeListings, listingLimit]
      properties:
        error:
          type: string
        plan:
          type: string
        activeListings:
          type: integer
        listingLimit:
          type: integer

    RegisterInput:
      type: object
      required: [email, password, companyName, contactName]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        companyName:
          type: string
        contactName:
          type: string
        phone:
          type: ["string", "null"]
        country:
          type: ["string", "null"]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, email, role, companyName, contactName, plan, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string
          enum: [buyer, seller, admin]
        companyName:
          type: string
        contactName:
          type: string
        phone:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        plan:
          type: string
          enum: [free, pro, enterprise]
        planExpiresAt:
          type: ["string", "null"]
        createdAt:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    SubscriptionInfo:
      type: object
      required: [plan, activeListings, listingLimit]
      properties:
        plan:
          type: string
          enum: [free, pro, enterprise]
        planExpiresAt:
          type: ["string", "null"]
        activeListings:
          type: integer
        listingLimit:
          type: ["integer", "null"]
        canAddListing:
          type: boolean

    UpgradePlanInput:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          enum: [pro, enterprise]

    Seller:
      type: object
      required: [id, companyName, contactName, country]
      properties:
        id:
          type: integer
        companyName:
          type: string
        contactName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        country:
          type: ["string", "null"]

    Listing:
      type: object
      required: [id, partNumber, description, manufacturer, condition, saleType, quantity, price, badge, status, sellerId, createdAt]
      properties:
        id:
          type: integer
        partNumber:
          type: string
        description:
          type: string
        aircraftApplicability:
          type: ["string", "null"]
        manufacturer:
          type: string
        condition:
          type: string
          enum: [new, overhauled, serviceable, as_removed, repaired]
        saleType:
          type: string
          enum: [outright, exchange, both]
        quantity:
          type: integer
        price:
          type: ["number", "null"]
        certificationDocs:
          type: array
          items:
            type: string
        photos:
          type: array
          items:
            type: string
        traceHistory:
          type: ["string", "null"]
        badge:
          type: string
          enum: [pending_verification, documentation_reviewed, verified]
        status:
          type: string
          enum: [active, removed]
        sellerId:
          type: integer
        seller:
          $ref: "#/components/schemas/Seller"
        createdAt:
          type: string
        updatedAt:
          type: string

    ListingInput:
      type: object
      required: [partNumber, description, manufacturer, condition, saleType, quantity]
      properties:
        partNumber:
          type: string
        description:
          type: string
        aircraftApplicability:
          type: ["string", "null"]
        manufacturer:
          type: string
        condition:
          type: string
          enum: [new, overhauled, serviceable, as_removed, repaired]
        saleType:
          type: string
          enum: [outright, exchange, both]
        quantity:
          type: integer
        price:
          type: ["number", "null"]
        certificationDocs:
          type: array
          items:
            type: string
        photos:
          type: array
          items:
            type: string
        traceHistory:
          type: ["string", "null"]

    ListingUpdate:
      type: object
      properties:
        partNumber:
          type: string
        description:
          type: string
        aircraftApplicability:
          type: ["string", "null"]
        manufacturer:
          type: string
        condition:
          type: string
          enum: [new, overhauled, serviceable, as_removed, repaired]
        saleType:
          type: string
          enum: [outright, exchange, both]
        quantity:
          type: integer
        price:
          type: ["number", "null"]
        certificationDocs:
          type: array
          items:
            type: string
        photos:
          type: array
          items:
            type: string
        traceHistory:
          type: ["string", "null"]

    BadgeUpdate:
      type: object
      required: [badge]
      properties:
        badge:
          type: string
          enum: [pending_verification, documentation_reviewed, verified]

    ListingsPage:
      type: object
      required: [listings, total, page, limit]
      properties:
        listings:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Inquiry:
      type: object
      required: [id, listingId, buyerName, buyerEmail, message, createdAt]
      properties:
        id:
          type: integer
        listingId:
          type: integer
        buyerName:
          type: string
        buyerEmail:
          type: string
        buyerPhone:
          type: ["string", "null"]
        buyerCompany:
          type: ["string", "null"]
        message:
          type: string
        createdAt:
          type: string

    InquiryInput:
      type: object
      required: [buyerName, buyerEmail, message]
      properties:
        buyerName:
          type: string
        buyerEmail:
          type: string
        buyerPhone:
          type: ["string", "null"]
        buyerCompany:
          type: ["string", "null"]
        message:
          type: string

    MarketplaceStats:
      type: object
      required: [totalListings, verifiedSellers, totalManufacturers, recentListings]
      properties:
        totalListings:
          type: integer
        verifiedSellers:
          type: integer
        totalManufacturers:
          type: integer
        recentListings:
          type: integer
        byCondition:
          type: array
          items:
            type: object
            required: [condition, count]
            properties:
              condition:
                type: string
              count:
                type: integer
        byBadge:
          type: array
          items:
            type: object
            required: [badge, count]
            properties:
              badge:
                type: string
              count:
                type: integer

    SellerStats:
      type: object
      required: [totalListings, activeListings, totalInquiries, verifiedListings, plan, listingLimit, canAddListing]
      properties:
        totalListings:
          type: integer
        activeListings:
          type: integer
        totalInquiries:
          type: integer
        verifiedListings:
          type: integer
        plan:
          type: string
          enum: [free, pro, enterprise]
        listingLimit:
          type: ["integer", "null"]
        canAddListing:
          type: boolean

    AdminStats:
      type: object
      required: [totalListings, totalSellers, pendingVerification, totalInquiries]
      properties:
        totalListings:
          type: integer
        totalSellers:
          type: integer
        pendingVerification:
          type: integer
        totalInquiries:
          type: integer

    Rfq:
      type: object
      required: [id, buyerName, buyerEmail, partNumber, description, quantity, status, createdAt]
      properties:
        id:
          type: integer
        buyerName:
          type: string
        buyerEmail:
          type: string
        buyerCompany:
          type: ["string", "null"]
        buyerPhone:
          type: ["string", "null"]
        partNumber:
          type: string
        description:
          type: string
        aircraftApplicability:
          type: ["string", "null"]
        condition:
          type: ["string", "null"]
        quantity:
          type: integer
        status:
          type: string
          enum: [open, closed]
        createdAt:
          type: string
        updatedAt:
          type: string

    RfqResponseItem:
      type: object
      required: [id, rfqId, sellerId, message, createdAt]
      properties:
        id:
          type: integer
        rfqId:
          type: integer
        sellerId:
          type: integer
        sellerCompanyName:
          type: string
        message:
          type: string
        listingId:
          type: ["integer", "null"]
        listingPartNumber:
          type: ["string", "null"]
        createdAt:
          type: string

    RfqDetail:
      type: object
      required: [rfq, responses]
      properties:
        rfq:
          $ref: "#/components/schemas/Rfq"
        responses:
          type: array
          items:
            $ref: "#/components/schemas/RfqResponseItem"

    RfqInput:
      type: object
      required: [buyerName, buyerEmail, partNumber, description, quantity]
      properties:
        buyerName:
          type: string
        buyerEmail:
          type: string
        buyerCompany:
          type: ["string", "null"]
        buyerPhone:
          type: ["string", "null"]
        partNumber:
          type: string
        description:
          type: string
        aircraftApplicability:
          type: ["string", "null"]
        condition:
          type: ["string", "null"]
        quantity:
          type: integer
          minimum: 1

    RfqResponseInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
        listingId:
          type: ["integer", "null"]

    RfqsPage:
      type: object
      required: [rfqs, total, page, limit]
      properties:
        rfqs:
          type: array
          items:
            $ref: "#/components/schemas/Rfq"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    SellerRfqStats:
      type: object
      required: [openRfqs, myResponses]
      properties:
        openRfqs:
          type: integer
        myResponses:
          type: integer
